name = "reading-room-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# After deploy, set the API key (NEVER commit it):
#   wrangler secret put ANTHROPIC_API_KEY
#
# Optional: bind a KV namespace for rate-limiting (uncomment after creating one
# with `wrangler kv:namespace create RATE_LIMIT_KV`):
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_KV_ID"
