# Netlify config for The Reading Room.
# Vanilla HTML/JS/CSS — no build step. Just publish the repo root.

[build]
  publish = "."
  # No build command — files are static.

# Headers — modest defaults for a classroom static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions-Policy: minimal — no camera, microphone, geolocation, etc.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Cache strategy: HTML never cached (so config.js updates land immediately),
# static assets can be cached briefly.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Don't try to deploy the API folder — that's the Cloudflare Worker, deployed
# separately via wrangler. Keep it in the repo for source-of-truth but
# Netlify ignores it.
[build.processing]
  skip_processing = false

[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
